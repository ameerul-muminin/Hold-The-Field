<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Agrocene · Team Anthropocene</title>
  <meta name="description" content="A farm's strategic partner built on real NASA data. The climate raids your farm, and you cannot let it win. Replay a real flash flood or drought in Bangladesh, day by day. NASA Space Apps Challenge 2026 · Field Shift." />
  <meta name="theme-color" content="#0a0e15" />
  <meta property="og:title" content="Agrocene · NASA Space Apps 2026" />
  <meta property="og:description" content="The flood comes early. So do we. A farming game on real NASA data." />
  <meta property="og:image" content="docs/images/web-title.jpg" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1826'/%3E%3Cpath d='M16 27V12M16 12c-3-1.5-4.5-4.5-4.5-7.5 3 .8 4.5 3 4.5 7.5zm0 0c3-1.5 4.5-4.5 4.5-7.5-3 .8-4.5 3-4.5 7.5zm0 7c-3-1.5-5-4.5-5-7.5 3 .8 5 3 5 7.5zm0 0c3-1.5 5-4.5 5-7.5-3 .8-5 3-5 7.5z' stroke='%23e6be4b' stroke-width='1.8' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body class="booting">
  <canvas id="world" aria-label="3D view of the farm"></canvas>

  <div id="boot" class="boot" role="status">
    <div class="boot-name">Agrocene</div>
    <div class="boot-bar"><i></i></div>
    <noscript>This game needs JavaScript.</noscript>
  </div>

  <!-- In-game overlay (mirrors the desktop HUD) -->
  <div id="hud" class="hud" hidden>
    <section class="card season-card" id="seasonCard">
      <div class="row"><b id="hudDate" class="date">1 Jan 2017</b><span id="hudDay" class="muted small"></span></div>
      <div class="timeline" id="timeline"><div class="track"></div><div class="fill" id="tlFill"></div><div class="dots" id="tlDots"></div><div class="now" id="tlNow"></div></div>
      <div class="chip scout-chip" id="scoutChip" role="status" aria-live="polite"><i></i><span id="scoutText">SCOUT  CALM</span></div>
    </section>

    <button class="card time-chip" id="timeChip" aria-label="Play or pause time (Space)"><span id="timeIcon"></span><b id="timeText">Paused</b><kbd>Space</kbd></button>
    <div class="speed" id="speedBox" aria-label="Speed">
      <button data-speed="0">1×</button><button data-speed="1">2×</button><button data-speed="2">4×</button><button data-speed="3">8×</button>
    </div>

    <section class="card data-card" id="dataCard">
      <div class="label" id="dataLabel">NASA POWER  /  TODAY</div>
      <div class="metrics" id="metrics"></div>
      <canvas class="spark" id="spark" aria-label="Rain, last 14 days"></canvas>
    </section>

    <section class="card gauge" id="gauge">
      <div class="label" id="gaugeLabel">Water</div>
      <div class="gauge-body"><div class="tube"><div class="fill" id="gaugeFill"></div><div class="boost" id="gaugeBoost"></div><div class="line" id="gaugeLine"><span id="gaugeLineText">bund</span></div></div><div class="ticks" id="gaugeTicks"></div></div>
      <b class="gauge-val" id="gaugeVal">0.00 m</b>
    </section>

    <div class="bottom">
      <div class="maturity card-lite"><div class="bar"><div id="matFill"></div><i></i></div><b id="matText">Rice 0%</b><span id="matHint" class="small muted">ready at 80%</span></div>
      <div class="bar-row">
        <div class="coins card-lite" id="coins"></div>
        <div class="slots" id="slots"></div>
      </div>
    </div>

    <ol class="feed" id="feed" aria-live="polite"></ol>
    <div class="speech card" id="speech" hidden><div class="avatar">H</div><div><b class="who" data-i18n>Rahim</b><p id="speechText"></p></div></div>
    <div class="prompt card" id="prompt" hidden>
      <b id="promptTitle">Press Space to begin the season</b>
      <p id="promptText"></p>
      <button class="btn primary" id="promptPlay"></button>
    </div>
    <div class="sat-overlay" id="satOverlay" hidden>
      <div id="satLabels"></div>
      <div class="card legend">
        <div class="sat-head"><b data-i18n>NASA SATELLITE VIEW</b><span id="satSub"></span></div>
        <div class="label" data-i18n>Data layers</div>
        <div class="grad rain"></div><span id="legendRain" class="small muted">rain intensity (upstream)</span>
        <div class="grad soil"></div><span class="small muted" data-i18n>soil wetness (dry to wet)</span>
      </div>
      <button class="btn" id="satBack" data-i18n>Back to the farm</button>
    </div>
    <div class="top-buttons">
      <button class="icon-btn" id="soundBtn" aria-label="Sound"></button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu (Esc)"></button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="screen" class="screen-host"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
