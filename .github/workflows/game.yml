name: game
on:
  pull_request:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and package
        run: mvn -B -f game/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: agrocene-jar
          path: game/target/agrocene.jar
